name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Inject production Inference Hub settings
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          INFERENCE_HUB_URL: ${{ vars.LINE_INFERENCE_HUB_URL }}
          INFERENCE_HUB_TOKEN: ${{ secrets.LINE_INFERENCE_HUB_TOKEN }}
          INFERENCE_HUB_MODEL: ${{ vars.LINE_INFERENCE_HUB_MODEL }}
          INFERENCE_HUB_TIMEOUT_SECONDS: ${{ vars.LINE_INFERENCE_HUB_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail
          test -n "$INFERENCE_HUB_URL"
          test -n "$INFERENCE_HUB_TOKEN"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("api/shared/deployment_settings.json")
          target.write_text(json.dumps({
              "INFERENCE_HUB_URL": os.environ["INFERENCE_HUB_URL"],
              "INFERENCE_HUB_TOKEN": os.environ["INFERENCE_HUB_TOKEN"],
              "INFERENCE_HUB_MODEL": os.environ.get("INFERENCE_HUB_MODEL") or "openai/openai/gpt-4o-mini",
              "INFERENCE_HUB_TIMEOUT_SECONDS": os.environ.get("INFERENCE_HUB_TIMEOUT_SECONDS") or "8",
          }), encoding="utf-8")
          PY
          chmod 600 api/shared/deployment_settings.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BAY_0083F4C00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true # Plain HTML/CSS/JS, no bundler to run
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BAY_0083F4C00 }}
          action: "close"
