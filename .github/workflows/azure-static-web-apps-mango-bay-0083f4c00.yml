name: Deploy to Azure Static Web Apps (production)

# main 每次更新後自動部署 production，也保留手動重新部署入口。
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 只需要讀取原始碼；SWA deploy action 使用 deployment token，不需要 OIDC id-token。
permissions:
  contents: read

# 避免 production 同時被部署多次。
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BAY_0083F4C00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true # Plain HTML/CSS/JS, no bundler to run
          ###### End of Repository/Build Configurations ######
