name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Inject production Inference Hub settings
        shell: bash
        env:
          INFERENCE_HUB_URL: ${{ github.ref == 'refs/heads/main' && vars.LINE_INFERENCE_HUB_URL || '' }}
          INFERENCE_HUB_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.LINE_INFERENCE_HUB_TOKEN || '' }}
          INFERENCE_HUB_MODEL: ${{ github.ref == 'refs/heads/main' && vars.LINE_INFERENCE_HUB_MODEL || '' }}
          INFERENCE_HUB_TIMEOUT_SECONDS: ${{ github.ref == 'refs/heads/main' && vars.LINE_INFERENCE_HUB_TIMEOUT_SECONDS || '' }}
          TAVILY_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.TAVILY_API_KEY || '' }}
          LINE_REMINDER_DISPATCH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.LINE_REMINDER_DISPATCH_TOKEN || '' }}
        run: |
          set -euo pipefail
          python api/inject_deployment_settings.py
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BAY_0083F4C00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true # Plain HTML/CSS/JS, no bundler to run
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BAY_0083F4C00 }}
          action: "close"
